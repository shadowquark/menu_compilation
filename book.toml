[book]
title = "食单集注"
language = "zh"

[build]
create-missing = false
extra-watch-dirs = ["fonts", "scripts"]

[preprocessor.fonts]
command = "python3 scripts/build_fonts.py"
after = ["links", "index"]
renderers = ["html"]

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
fold = {enable = true, level = 4}
no-section-label = true
sidebar-header-nav = false
additional-css = ["src/assets/fonts.css", "src/assets/book.css", "src/assets/layout.css"]
additional-js = ["src/assets/navigation.js"]

[output.html.search]
enable = false

