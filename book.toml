[book]
title = "食单集注"
language = "zh"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
fold = {enable = true, level = 4}
no-section-label = true
sidebar-header-nav = false
additional-css = ["src/assets/book.css", "src/assets/layout.css"]
additional-js = ["src/assets/fzf.umd.js", "src/assets/elasticlunr.js", "src/assets/navigation.js"]

[output.html.search]
enable = true
limit-results = 1000

